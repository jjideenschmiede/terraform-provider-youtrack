name: Feature Request
description: Suggest a new resource, data source or attribute for the Terraform Provider for YouTrack.
title: "feat: "
labels: ["feature"]
assignees:
  - gowizzard
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please describe what you would like to achieve, so we can find the best solution together.
  - type: textarea
    id: problem
    attributes:
      label: Which problem would the feature solve?
      description: Describe which part of your YouTrack configuration you cannot manage with the provider yet.
      placeholder: We manage our agile boards by hand, and …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should the feature work?
      description: Describe the resource, data source or attribute you have in mind, ideally with an example configuration.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Did you consider other solutions, for example a workflow or a script against the REST API?
  - type: input
    id: youtrack-version
    attributes:
      label: YouTrack version
      description: You can find the version and build under Help at the bottom of the YouTrack sidebar.
      placeholder: 2026.2.19656
